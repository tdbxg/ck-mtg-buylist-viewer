<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>晴屋日本价格 | MTG 单卡价格雷达</title>
  <link rel="stylesheet" href="./styles.css?v=20260730-hareruyamtg">
  <link rel="stylesheet" href="./hareruya.css?v=20260730-hareruyamtg">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>晴屋日本价格</h1>
      <p id="metaLine">正在载入晴屋价格快照...</p>
    </div>
    <div class="summary" aria-label="summary">
      <div><span id="itemCount">-</span><small>精确商品</small></div>
      <div><span id="jpyRate">-</span><small>JPY/CNY</small></div>
      <div><span id="updatedAt">-</span><small>最后更新</small></div>
    </div>
  </header>

  <nav class="app-tabs" aria-label="页面切换">
    <a class="tab-link" href="./index.html">单卡查询 / 回收车</a>
    <a class="tab-link" href="./index.html#movers">价格变动榜</a>
    <a class="tab-link active" href="./hareruya.html">晴屋日本</a>
  </nav>

  <main class="hareruya-layout">
    <section class="hareruya-controls" aria-label="晴屋筛选">
      <div class="field hareruya-search">
        <label for="queryInput">牌名 / 系列 / 编号</label>
        <input id="queryInput" type="search" placeholder="如 Metallic / AER / 164 / 晴屋商品 ID">
      </div>
      <div class="field">
        <label for="languageSelect">语言</label>
        <select id="languageSelect"><option value="">全部语言</option><option value="JP">日文</option><option value="EN">英文</option></select>
      </div>
      <div class="field">
        <label for="sortSelect">排序</label>
        <select id="sortSelect"><option value="buyDesc">收购价从高到低</option><option value="saleAsc">NM 售价从低到高</option><option value="nameAsc">牌名 A-Z</option></select>
      </div>
      <a class="official-link" href="https://www.hareruyamtg.com/ja/" target="_blank" rel="noreferrer">打开晴屋官网</a>
    </section>
    <section class="hareruya-note">
      <strong>精确版本规则：</strong>每行仅对应一个晴屋商品 ID。售价按 NM/SP/MP/HP 分列；收购价以晴屋公开收购页当期标价为准。未配置商品 ID 的牌不会按同名猜测匹配。
    </section>
    <section id="cards" class="hareruya-cards" aria-live="polite"></section>
    <section id="emptyState" class="empty-state" hidden>没有符合条件的晴屋商品。</section>
  </main>
  <template id="cardTemplate">
    <article class="hareruya-card">
      <img class="hareruya-image" alt="" loading="lazy">
      <div class="hareruya-main">
        <div class="name-row"><h2></h2><span class="badge"></span></div>
        <p class="hareruya-subtitle"></p>
        <div class="hareruya-details"></div>
        <div class="hareruya-prices"></div>
        <div class="hareruya-links"></div>
      </div>
    </article>
  </template>
  <script src="./hareruya.js?v=20260730-hareruyamtg"></script>
</body>
</html>
