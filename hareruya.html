<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>晴屋日本价格 | MTG 单卡价格雷达</title>
  <link rel="stylesheet" href="./styles.css?v=20260801-hareruyamtg-refresh">
  <link rel="stylesheet" href="./hareruya.css?v=20260801-hareruyamtg-refresh">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>晴屋日本价格</h1>
      <p id="metaLine">正在载入晴屋价格快照...</p>
    </div>
    <div class="summary" aria-label="summary">
      <div><span id="itemCount">-</span><small>公开商品</small></div>
      <div><span id="jpyRate">-</span><small>JPY/CNY</small></div>
      <div><span id="updatedAt">-</span><small>价格快照</small></div>
    </div>
  </header>

  <nav class="app-tabs" aria-label="页面切换">
    <a class="tab-link" href="./index.html">单卡查询 / 回收车</a>
    <a class="tab-link" href="./index.html#movers">价格变动榜</a>
    <a class="tab-link active" href="./hareruya.html">晴屋日本</a>
  </nav>

  <main class="layout">
    <aside class="filters" aria-label="晴屋筛选">
      <div class="filter-primary hareruya-filter-primary">
        <div class="field query-field">
          <label for="searchInput">牌名片段</label>
          <input id="searchInput" type="search" placeholder="日文或英文牌名，可只输一部分">
        </div>
        <div class="field query-field">
          <label for="printSearchInput">版本定位</label>
          <input id="printSearchInput" type="search" placeholder="系列、编号或晴屋商品 ID，如 3ED / 2639">
        </div>
        <div class="field">
          <label for="languageSelect">语言</label>
          <select id="languageSelect"><option value="">全部语言</option><option value="JP">日文</option><option value="EN">英文</option></select>
        </div>
        <div class="field">
          <label for="minBuyInput">最低收购价</label>
          <input id="minBuyInput" type="number" min="0" step="100" value="0" aria-label="最低晴屋收购价（日元）">
        </div>
        <div class="field">
          <label for="sortSelect">排序</label>
          <select id="sortSelect">
            <option value="buyRatioDesc">收购 / NM 售价比例从高到低</option>
            <option value="buyDesc">收购价从高到低</option>
            <option value="saleDesc">NM 售价从高到低</option>
            <option value="saleAsc">NM 售价从低到高</option>
            <option value="nameAsc">牌名 A-Z</option>
            <option value="setAsc">晴屋标记 A-Z</option>
          </select>
        </div>
        <div class="filter-actions">
          <button id="resetButton" class="secondary-button" type="button">重置</button>
        </div>
      </div>

      <div class="checks quick-checks">
        <label><input id="withImageOnly" type="checkbox"> 只看有图片</label>
        <label><input id="buyableOnly" type="checkbox"> 只看有收购价</label>
      </div>

      <details class="filter-drawer" open>
        <summary><span>系列与版本筛选</span><small id="filterSummary">默认筛选</small></summary>
        <div class="drawer-body hareruya-advanced-grid">
          <div class="field">
            <label for="setFinderInput">晴屋标记查找</label>
            <input id="setFinderInput" type="search" placeholder="如 3ED / IMA / DCIマーク">
          </div>
          <div class="field">
            <label for="setSelect">晴屋版本标记</label>
            <select id="setSelect"><option value="">全部标记</option></select>
          </div>
          <p class="hint hareruya-data-note">每条记录只对应晴屋商品 ID 与语言。图片来自该商品公开页；晴屋未给出时不会用同名图片替代。</p>
        </div>
      </details>
    </aside>

    <details class="cart-panel collapsible-panel" open aria-label="Hareruya buylist cart">
      <summary class="panel-summary">
        <div>
          <h2>晴屋回收车</h2>
          <p id="cartSummary">0 种 / 0 张 / 收购 ¥0 / ¥0.00</p>
        </div>
        <span class="summary-toggle" aria-hidden="true"></span>
      </summary>
      <div class="panel-content">
        <div class="cart-actions">
          <button id="exportCartButton" type="button">导出牌表 CSV</button>
          <button id="clearCartButton" type="button">清空</button>
        </div>
        <div class="cart-bulk-tools">
          <input id="cartSearchInput" type="search" placeholder="在回收车中查牌名、版本、编号或晴屋 ID">
          <label><input id="cartSelectVisible" type="checkbox"> 全选当前结果</label>
          <button id="removeSelectedCartButton" type="button" class="danger-button">移除已选</button>
          <span id="cartSelectionSummary" class="hint"></span>
        </div>
        <div id="cartTableWrap" class="cart-table-wrap">
          <table class="cart-table hareruya-cart-table">
            <thead><tr><th class="cart-check-col">选</th><th>牌名</th><th>晴屋标记</th><th>语言</th><th>数量</th><th>收购</th><th>NM 售价</th><th>操作</th></tr></thead>
            <tbody id="cartRows"></tbody>
          </table>
        </div>
        <div id="cartEmpty" class="cart-empty">还没有加入晴屋回收车</div>
      </div>
    </details>

    <details class="history-panel collapsible-panel" aria-label="Hareruya browse history">
      <summary class="panel-summary">
        <div>
          <h2>历史浏览</h2>
          <p id="historySummary">最近看过的晴屋商品会显示在这里</p>
        </div>
        <span class="summary-toggle" aria-hidden="true"></span>
      </summary>
      <div class="panel-content">
        <div class="cart-actions"><button id="clearHistoryButton" type="button">清空历史</button></div>
        <div id="historyRows" class="history-list"></div>
        <div id="historyEmpty" class="cart-empty">还没有浏览记录</div>
      </div>
    </details>

    <section class="results">
      <div class="resultbar">
        <div><strong id="resultCount">0</strong><span>条结果</span></div>
        <div class="pager"><button id="prevButton" type="button" aria-label="上一页">‹</button><span id="pageLine">1 / 1</span><button id="nextButton" type="button" aria-label="下一页">›</button></div>
      </div>
      <div id="cardsGrid" class="cards-grid"></div>
      <div id="emptyState" class="empty" hidden>没有符合条件的晴屋商品</div>
    </section>
  </main>

  <template id="cardTemplate">
    <article class="card hareruya-card">
      <div class="thumb"><img loading="lazy" alt=""></div>
      <div class="card-main">
        <div class="name-row"><h2></h2><span class="badge"></span></div>
        <p class="cn"></p>
        <div class="details"></div>
        <div class="prices"></div>
        <div class="links"></div>
      </div>
    </article>
  </template>
  <script src="./hareruya.js?v=20260826-history-no-images"></script>
</body>
</html>
